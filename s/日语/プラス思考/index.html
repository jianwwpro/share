    <p>「プラス思考」という言葉がある。ある出来事が起こった時に、悲観的に考えるのではなく、「プラス」の方向に楽観的に考えるということである。</p>
<p>最近、プラス思考で物事を考え、さらにプラスの言葉を使うことによって、自分が望んだように物事がうまく行くようになるということが言われている。脳科学の研究によると、プラス思考でプラスの言葉を使うことによって、脳が体に働きかけ、実際の行動につながり、思ったことが実現するのだそうだ。</p>
