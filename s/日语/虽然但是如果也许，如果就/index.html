    <p>かもしれません/ かもね：也许</p>
<p>もしかして：难道说</p>
<p>たら：如果</p>
<p>といっても：即使</p>
<p>どれだけ：怎么，多么</p>
<p>どれだけ心配したか</p>
<p>いくら〜ても：无论怎么说都</p>
<p>いかに：怎么，怎样</p>
<p>いかに急いでも：不管你怎么着急</p>
<p>いかに生活するのか。到底要怎么样的生活。</p>
<p>どんなに：那样，那种</p>
<p>どんなに頑張れってできない</p>
