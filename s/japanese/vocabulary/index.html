<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>日语单词复习</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#8a91a0;
  --accent:#3b6ef6; --green:#22b573; --red:#ef5b5b; --line:#e8eaf0;
  --shadow:0 8px 30px rgba(30,40,80,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans","Noto Sans CJK SC","Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; display:flex; flex-direction:column; overscroll-behavior:none;
}
header{background:#fff; border-bottom:1px solid var(--line); padding:12px 16px 10px; position:sticky; top:0; z-index:5;}
.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.top h1{font-size:18px; margin:0; font-weight:700;}
.top .actions{display:flex; gap:6px;}
.top button{border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer;}
.top button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; border:1px solid var(--line); background:#fff; color:#4a5264; border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; white-space:nowrap;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.chip.course.active{background:var(--accent); border-color:var(--accent);}
.chip .cnt{opacity:.55; font-size:11px; margin-left:3px;}
.row.lessons{margin-top:8px;}
.progress{display:flex; align-items:center; gap:10px; padding:10px 16px 0;}
.bar{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
.bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .3s;}
.progress .num{font-size:12px; color:var(--muted); min-width:64px; text-align:right; font-variant-numeric:tabular-nums;}
main{flex:1; display:flex; align-items:center; justify-content:center; padding:18px 16px 14px; perspective:1200px;}
.card-wrap{width:100%; max-width:440px; aspect-ratio:4/5; position:relative; cursor:pointer;}
.card{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.25,1); border-radius:22px;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:22px; background:var(--card); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center;}
.face.back{transform:rotateY(180deg); background:linear-gradient(160deg,#ffffff,#f6f8ff);}
.face .hint{position:absolute; top:18px; left:0; right:0; font-size:12px; color:var(--muted); letter-spacing:.06em;}
.word{font-size:44px; font-weight:700; line-height:1.2; word-break:break-word;}
.reading{font-size:20px; color:var(--muted); margin-top:12px; min-height:1em;}
.meaning{font-size:26px; font-weight:600; line-height:1.45; word-break:break-word; color:#2a3145;}
.back .reading{font-size:16px; color:var(--accent); margin-top:14px;}
.part{display:inline-block; margin-top:16px; padding:5px 13px; border-radius:999px; font-size:13px; background:#eef2ff; color:var(--accent); font-weight:600;}
.tag{position:absolute; bottom:16px; left:0; right:0; font-size:11px; color:#b0b5c0;}
footer{padding:12px 16px calc(16px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line);}
.ctrl{display:flex; gap:12px; max-width:440px; margin:0 auto;}
.ctrl button{flex:1; border:none; border-radius:14px; padding:15px 0; font-size:16px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; transition:transform .08s;}
.ctrl button:active{transform:scale(.96);}
.ctrl button small{font-size:11px; font-weight:400; opacity:.75;}
.btn-no{background:#ffe9e9; color:var(--red);}
.btn-flip{background:#eef1f6; color:#4a5264; flex:.7;}
.btn-yes{background:#e6f8f0; color:var(--green);}
.stats{max-width:440px; margin:10px auto 0; display:flex; justify-content:center; gap:20px; font-size:12px; color:var(--muted);}
.stats b{color:var(--ink); font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>日语单词复习</h1>
    <div class="actions">
      <button id="btnShuffle">随机</button>
      <button id="btnUnknown">未掌握</button>
      <button id="btnReset">重置</button>
    </div>
  </div>
  <div class="row" id="courseRow"></div>
  <div class="row lessons" id="lessonRow"></div>
</header>

<div class="progress">
  <div class="bar"><i id="barFill"></i></div>
  <div class="num" id="progNum">0 / 0</div>
</div>

<main>
  <div class="card-wrap" id="cardWrap" onclick="flip()">
    <div class="card" id="card">
      <div class="face front">
        <div class="hint">单词</div>
        <div class="word" id="frontWord">—</div>
        <div class="reading" id="frontReading"></div>
        <div class="tag" id="frontTag"></div>
      </div>
      <div class="face back">
        <div class="hint">释义</div>
        <div class="meaning" id="backMeaning">—</div>
        <div class="part" id="backPart" style="display:none"></div>
        <div class="reading" id="backReading"></div>
        <div class="tag" id="backTag"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="ctrl">
    <button class="btn-no" id="btnNo">不认识<small>需复习</small></button>
    <button class="btn-flip" id="btnFlip">翻转</button>
    <button class="btn-yes" id="btnYes">认识<small>已掌握</small></button>
  </div>
  <div class="stats">
    <span>已掌握 <b id="stKnown">0</b></span>
    <span>未掌握 <b id="stUnknown">0</b></span>
    <span>总计 <b id="stTotal">0</b></span>
  </div>
</footer>

"meaning": "注意到，意识到", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "気が早い", "reading": "", "meaning": "心情急切，急躁", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "気が楽（らく）だ", "reading": "", "meaning": "心情舒畅，轻松。→気楽", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "気が軽い", "reading": "", "meaning": "気軽、心情轻松", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "気を付ける", "reading": "", "meaning": "小心，注意", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "泥", "reading": "どろ", "meaning": "「N」泥；小偷", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "混雑する", "reading": "こんざつ", "meaning": "「V3」混乱，杂乱，拥挤", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "湯呑み", "reading": "ゆのみ", "meaning": "茶杯", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "漸く", "reading": "", "meaning": "书面 やっと：口语，花费时间长；勉勉强强", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "漸く（やっと）間に合う", "reading": "", "meaning": "终于赶上了", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "生命", "reading": "せいめい", "meaning": "「N」生命", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "真似", "reading": "まね", "meaning": "「N」模仿，模拟", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "真剣", "reading": "しんけん", "meaning": "「A2」真刀真枪，认真，正经，严肃", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "立ち上がる", "reading": "たちあがる", "meaning": "「V１」站起来", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "箇所", "reading": "かしょ", "meaning": "「N」地方，处所", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "終に", "reading": "", "meaning": "书面 到頭：口语", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "繋がり", "reading": "つながり", "meaning": "「N」联系，关系", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "考え事", "reading": "", "meaning": "「N」考虑问题，心事，担心事", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "腹を立てる", "reading": "", "meaning": "生气，发火", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "苦しい", "reading": "くるしい", "meaning": "「A1」 痛苦，苦", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "苦難", "reading": "くなん", "meaning": "「N」苦难，困难", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "解消する", "reading": "かいしょう", "meaning": "「V3」缓解，解除，取消，消灭", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "諺", "reading": "ことわざ", "meaning": "「N」諺語", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "轢く", "reading": "ひく", "meaning": "撞，轧", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "追加する", "reading": "ついかする", "meaning": "「V3」追加", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "適切", "reading": "てきせつ", "meaning": "「A2」恰当，适当，适合", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "遮る", "reading": "さえぎる", "meaning": "「V1」阻挡，遮挡，遮住，挡住", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "酔っ払う", "reading": "よっぱらう", "meaning": "「V１」醉酒", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "金儲け", "reading": "かねもうけ", "meaning": "「N」赚钱", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "関わる", "reading": "かかわる", "meaning": "关系到，涉及到", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "関わる", "reading": "", "meaning": "「V１」相关，关联", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "頷く", "reading": "うなずく", "meaning": "「V１」点头", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}, {"word": "食べ歩き", "reading": "たべあるき", "meaning": "「N」边走边吃", "part": "", "course": "中级下", "lesson": 20, "lessonLabel": "第20课", "source": "第20課　期望の灯"}];
const WORDS = RAW.map(w=>({
  id: w.word+'|'+(w.reading||''),
  word: w.word, reading: w.reading||'', meaning: w.meaning||'',
  part: w.part||'', course: w.course||'综合', lesson: w.lessonLabel||'其他', n: w.lesson||999
})).filter(w=>w.word);

const COURSE_ORDER = ['初级','中级上','中级下','综合'];
const courses = COURSE_ORDER.filter(c=>WORDS.some(w=>w.course===c));

const KEY='jp_vocab_known_v2';
let known = new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
let deck = WORDS.slice();
let idx = 0;
let curCourse = '全部', curLesson = '全部';
let unknownOnly = false;

function lessonsOf(course){
  const m = new Map();
  for(const w of WORDS){ if(w.course===course && !m.has(w.lesson)) m.set(w.lesson, w.n); }
  return [...m.entries()].sort((a,b)=>(a[1]||999)-(b[1]||999)).map(e=>e[0]);
}

function save(){ localStorage.setItem(KEY, JSON.stringify([...known])); }

function buildDeck(){
  let d = WORDS;
  if(curCourse!=='全部') d = d.filter(w=>w.course===curCourse);
  if(curLesson!=='全部') d = d.filter(w=>w.lesson===curLesson);
  if(unknownOnly) d = d.filter(w=>!known.has(w.id));
  deck = d; idx = 0; render();
}

function render(){
  const wrap=document.getElementById('cardWrap');
  if(deck.length===0){
    wrap.style.visibility='hidden';
    document.getElementById('barFill').style.width='0%';
    document.getElementById('progNum').textContent='0 / 0';
    updateStats(); return;
  }
  wrap.style.visibility='';
  const w=deck[idx];
  document.getElementById('frontWord').textContent=w.word;
  document.getElementById('frontReading').textContent=w.reading;
  document.getElementById('backMeaning').textContent=w.meaning||'（暂无释义）';
  document.getElementById('backReading').textContent=w.reading;
  const p=document.getElementById('backPart');
  if(w.part){p.style.display='';p.textContent=w.part;} else {p.style.display='none';}
  const tag=(w.course==='综合'?'':w.course+' · ')+w.lesson;
  document.getElementById('frontTag').textContent=tag;
  document.getElementById('backTag').textContent=tag;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('barFill').style.width=(idx/deck.length*100)+'%';
  document.getElementById('progNum').textContent=(idx+1)+' / '+deck.length;
  updateStats();
}

function updateStats(){
  const total=WORDS.length; let k=0;
  for(const w of WORDS){ if(known.has(w.id)) k++; }
  document.getElementById('stKnown').textContent=k;
  document.getElementById('stUnknown').textContent=total-k;
  document.getElementById('stTotal').textContent=total;
}

function flip(){ if(deck.length) document.getElementById('card').classList.toggle('flipped'); }
function mark(know){
  if(!deck.length) return;
  const w=deck[idx];
  if(know) known.add(w.id); else known.delete(w.id);
  save(); updateStats(); next();
}
function next(){ if(!deck.length) return; idx = idx<deck.length-1 ? idx+1 : 0; render(); }
function prev(){ if(!deck.length) return; idx = idx>0 ? idx-1 : deck.length-1; render(); }

function buildCourseRow(){
  const el=document.getElementById('courseRow'); el.innerHTML='';
  for(const c of ['全部', ...courses]){
    const chip=document.createElement('div');
    chip.className='chip course'+(c===curCourse?' active':'');
    const n = c==='全部' ? WORDS.length : WORDS.filter(w=>w.course===c).length;
    chip.innerHTML = c + '<span class="cnt">'+n+'</span>';
    chip.onclick=()=>{ curCourse=c; curLesson='全部'; buildCourseRow(); buildLessonRow(); buildDeck(); };
    el.appendChild(chip);
  }
}
function buildLessonRow(){
  const el=document.getElementById('lessonRow'); el.innerHTML='';
  if(curCourse==='全部'){ el.style.display='none'; return; }
  el.style.display='';
  const ls=['全部', ...lessonsOf(curCourse)];
  for(const l of ls){
    const chip=document.createElement('div');
    chip.className='chip'+(l===curLesson?' active':'');
    const n = l==='全部' ? WORDS.filter(w=>w.course===curCourse).length : WORDS.filter(w=>w.course===curCourse&&w.lesson===l).length;
    chip.innerHTML = l + '<span class="cnt">'+n+'</span>';
    chip.onclick=()=>{ curLesson=l; buildLessonRow(); buildDeck(); };
    el.appendChild(chip);
  }
}

document.getElementById('btnFlip').onclick=(e)=>{e.stopPropagation();flip();};
document.getElementById('btnYes').onclick=()=>mark(true);
document.getElementById('btnNo').onclick=()=>mark(false);
document.getElementById('btnShuffle').onclick=function(){
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0; this.classList.toggle('on'); render();
};
document.getElementById('btnUnknown').onclick=function(){ unknownOnly=!unknownOnly; this.classList.toggle('on',unknownOnly); buildDeck(); };
document.getElementById('btnReset').onclick=function(){ if(confirm('清空所有掌握进度？')){ known.clear(); save(); buildDeck(); } };

document.addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); }
  else if(e.key==='ArrowLeft') mark(false);
  else if(e.key==='ArrowRight') mark(true);
  else if(e.key==='ArrowUp') prev();
});

let tx=0,ty=0;
document.getElementById('cardWrap').addEventListener('touchstart', e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById('cardWrap').addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4){ dx>0?mark(true):mark(false); }
},{passive:true});

buildCourseRow(); buildLessonRow(); buildDeck();
</script>
