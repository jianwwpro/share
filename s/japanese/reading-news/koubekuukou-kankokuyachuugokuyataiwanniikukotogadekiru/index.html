    <p>2025年4月18日　19時27分</p>
<p>神戸市にある神戸空港で、国際線の利用が始まりました。</p>
<p>神戸空港は、今まで、国内線だけでした。18日からは、韓国、中国、台湾に行く国際線の飛行機も飛びます。国際線は、一週間に40予定です。</p>
<p>神戸空港では18日、お祝(いわ)いの式（しき）がありました。午前9時半ごろ、最初の国際線の飛行機が台湾から着きました。</p>
<p>台湾から来た二十五歳の女性は「神戸で観光をしたり、お菓子（かし）を食べたりしたいです。大阪にも行って、万博を楽しみたいです」</p>
