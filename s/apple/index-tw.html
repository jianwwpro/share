<style>
:root{--bg:#f7f7f9;--card:#fff;--txt:#1c1c1e;--dim:#6b7280;--line:#e5e7eb;--accent:#4f6ef7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--txt:#e8eaf0;--dim:#9aa3b2;--line:#252a35;--accent:#7d95ff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 72px}
h1{font-size:26px;line-height:1.3;margin:0 0 6px}
h2{font-size:18px;margin:30px 0 10px;padding-top:8px;border-top:1px solid var(--line)}
h2:first-of-type{border-top:0;padding-top:0}
ul,ol{padding-left:20px}li{margin:6px 0}
.meta{color:var(--dim);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.muted{color:var(--dim);font-size:14px}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.langs a{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--dim)}
.langs a.on{color:var(--accent);border-color:var(--accent)}
.langs a.home{padding:6px 10px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.nav a{font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
</style>
